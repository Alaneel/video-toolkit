[package]
name = "file_workflows"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT"
description = "PDF, subtitle, document and URL workflows shared by Video Toolkit"

[dependencies]
anyhow = "1"
file_conversion = { path = "../file_conversion" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
encoding_rs = "=0.8.35"
regex = "1"
url = "2"
libc = "0.2"

