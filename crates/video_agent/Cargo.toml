[package]
name = "video_agent"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
common = { path = "../common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
fs2 = "0.4"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# Keep compatibility with the existing local Rust 1.87 toolchain.
encoding_rs = "=0.8.35"
base64 = "0.21"
image = { version = "0.24", default-features = false, features = ["jpeg"] }
