[package]
name = "file_conversion"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT"
description = "Shared local-only media conversion and queue engine for Video ToolKit"

[dependencies]
anyhow = "1"
common = { path = "../common" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
