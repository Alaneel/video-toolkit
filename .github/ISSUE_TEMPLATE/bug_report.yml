name: Bug report
description: Report a reproducible problem in Video ToolKit
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Tell us what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Run…\n2. Select…\n3. See…"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Video ToolKit version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and FFmpeg version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
