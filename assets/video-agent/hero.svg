<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="title desc">
  <title id="title">Video Agent — a cut you control</title>
  <desc id="desc">A bounded workflow from timestamped observations and model proposals through human review and exact-plan approval to verified media.</desc>
  <rect x="1" y="1" width="1278" height="298" rx="20" fill="#131821" stroke="#304152"/>
  <path d="M48 43h28" stroke="#64d0b8" stroke-width="4" stroke-linecap="round"/>
  <text x="92" y="49" font-family="Arial,Helvetica,sans-serif" font-size="15" letter-spacing="2.5" fill="#a5b3c6">LOCAL FOOTAGE. BOUNDED INTELLIGENCE.</text>
  <text x="46" y="119" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="700" letter-spacing="-1.5" fill="#edf4fb">Video Agent</text>
  <text x="48" y="164" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#a5b3c6">From sampled frames to a cut you control.</text>
  <g fill="#1b2633" stroke="#3a5365">
    <rect x="48" y="207" width="208" height="48" rx="10"/><rect x="292" y="207" width="208" height="48" rx="10"/>
    <rect x="536" y="207" width="208" height="48" rx="10"/><rect x="780" y="207" width="208" height="48" rx="10"/>
    <rect x="1024" y="207" width="208" height="48" rx="10"/>
  </g>
  <path d="M264 231h20m224 0h20m224 0h20m224 0h20" stroke="#64d0b8" stroke-width="2"/>
  <g font-family="Arial,Helvetica,sans-serif" font-size="15" letter-spacing="2" text-anchor="middle" fill="#edf4fb">
    <text x="152" y="237">OBSERVE</text><text x="396" y="237">PROPOSE</text><text x="640" y="237">REVIEW</text>
    <text x="884" y="237">APPROVE</text><text x="1128" y="237">VERIFY</text>
  </g>
  <text x="1230" y="120" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="16" letter-spacing="1" fill="#64d0b8">RUST / NATIVE DESKTOP / FFMPEG</text>
</svg>
